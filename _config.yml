title: "02806 Final Project - Group 70"
description: "A long-form, magazine-style GitHub Pages site"
url: "https://halefader.github.io"
#remote_theme: "mmistakes/minimal-mistakes@4.24.0"
#remote_theme: mmistakes/minimal-mistakes
theme: minima
minimal_mistakes_skin: "default"

plugins:
  - jekyll-include-cache
  - jekyll-seo-tag


defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      classes: wide layout--wide

sass:
  style: compressed

